apply plugin: 'com.android.application'

def releaseStoreFile = System.getenv('BIZNAKO_KEYSTORE_FILE')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseKeyAlias, releaseStorePassword, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace "mg.biznako.gestion"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "mg.biznako.gestion"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions += "minAndroidApi"
    productFlavors {
        api23 {
            dimension "minAndroidApi"
            minSdkVersion 23
        }
        api29 {
            dimension "minAndroidApi"
            minSdkVersion 29
        }
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release' && project.hasProperty('releaseVersionCode')) {
            def releaseCode = project.property('releaseVersionCode').toInteger()
            if (releaseCode < 1) throw new GradleException("releaseVersionCode must be a positive integer")
            variant.outputs.all { output -> output.versionCodeOverride = releaseCode }
        }
    }
}
repositories {
    flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' }
}
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}
apply from: 'capacitor.build.gradle'
