</style><script src="https://accounts.google.com/gsi/client" async defer></script></head><body><div id="app"><p role="status">Chargement / Miandry kely…</p></div><div id="modal" hidden></div><div id="toast" role="status" aria-live="polite"></div><script>/* Biznako domain model. Pure functions: no DOM, network or storage. Monetary units: whole MGA. */
(function(root){'use strict';
const tables=['activities','contacts','suppliers','products','lots','sales','deals','payments','expenses'];
const uid=()=> 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const clone=o=>JSON.parse(JSON.stringify(o));
function empty(){return {schema:1,revision:0,updatedAt:null,settings:{name:'Biznako',lang:'fr',theme:'light',assistant:true,onboard:false,businessMode:'mixed',enabledTables:{sales:true,products:true,lots:true,deals:true,receivables:true,payments:true,expenses:true,contacts:true,suppliers:true,reports:true,assistant:true,audit:true}},statuses:[{id:'draft',label:'Brouillon',effect:'draft'},{id:'valid',label:'Validé',effect:'valid'},{id:'cancel',label:'Annulé',effect:'cancel'}],activities:[{id:'yogurt',name:'Yaourt artisanal',kind:'goods'},{id:'property',name:'Service',kind:'service'}],contacts:[],suppliers:[],products:[],lots:[],sales:[],deals:[],payments:[],expenses:[],audit:[],filters:[]};}
const get=(s,t,id)=>s[t].find(x=>x.id===id);
const effect=(s,r)=>s.statuses.find(x=>x.id===r.status)?.effect;
const total=r=>Math.round(r.lines.reduce((n,l)=>n+l.qty*l.price,0));
const commission=r=>Math.round(r.base*r.rate/100*r.share/100);
const paid=(s,type,id)=>s.payments.filter(p=>p.type===type&&p.ref===id).reduce((n,p)=>n+p.amount,0);
const stock=(s,id,except)=>(s.lots.find(l=>l.id===id).qty-(s.lots.find(l=>l.id===id).loss||0))-s.sales.filter(r=>r.id!==except&&effect(s,r)==='valid').reduce((n,r)=>n+r.lines.filter(l=>l.lot===id).reduce((m,l)=>m+l.qty,0),0);
function assert(ok,msg){if(!ok)throw Error(msg);}
function num(v,min=0,max=1e12){return typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max;}
function date(v){return typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(Date.parse(v))&&new Date(v).toISOString().slice(0,10)===v;}
function text(v,max=500){return typeof v==='string'&&v.trim().length>0&&v.length<=max;}
function validate(s){
assert(s&&s.schema===1,'Version de sauvegarde non prise en charge.');
assert(s.settings&&['fr','mg'].includes(s.settings.lang)&&['light','dark'].includes(s.settings.theme)&&text(s.settings.name,100),'Préférences invalides.');
s.settings.businessMode=['goods','service','mixed'].includes(s.settings.businessMode)?s.settings.businessMode:'mixed';
const tableDefaults={sales:true,products:true,lots:true,deals:true,receivables:true,payments:true,expenses:true,contacts:true,suppliers:true,reports:true,assistant:true,audit:true};
s.settings.enabledTables={...tableDefaults,...(s.settings.enabledTables||{})};
for(const [k,v] of Object.entries(s.settings.enabledTables))assert(Object.hasOwn(tableDefaults,k)&&typeof v==='boolean','Configuration des tables invalide.');
assert(Array.isArray(s.statuses)&&s.statuses.length>=3&&s.statuses.length<=50,'Statuts invalides.');
const statusIds=new Set();s.statuses.forEach(x=>{assert(text(x.id,100)&&!statusIds.has(x.id)&&text(x.label,60)&&['draft','valid','cancel'].includes(x.effect),'Statut invalide.');statusIds.add(x.id);});
['draft','valid','cancel'].forEach(x=>assert(s.statuses.some(t=>t.effect===x),'Une catégorie de statut est absente.'));
assert(Array.isArray(s.audit)&&s.audit.length<=5000&&Array.isArray(s.filters)&&s.filters.length<=100,'Journal ou filtres invalides.');
s.audit.forEach(a=>assert(text(a.id,100)&&text(a.action,200)&&text(a.at,60),'Journal invalide.'));
s.filters.forEach(f=>{assert(text(f.id,100)&&text(f.name,60)&&text(f.view,30)&&f.query&&typeof f.query==='object','Filtre invalide.');for(const k of ['q','activity','status','from','to','sort'])assert(typeof f.query[k]==='string'&&f.query[k].length<500,'Filtre invalide.');if(f.query.field===undefined)f.query.field='all';assert(['all','name','note','id'].includes(f.query.field),'Champ de recherche invalide.');assert(!f.query.from||date(f.query.from),'Date de filtre invalide.');assert(!f.query.to||date(f.query.to),'Date de filtre invalide.');});
if(!Array.isArray(s.suppliers))s.suppliers=[];
for(const t of tables){assert(Array.isArray(s[t])&&s[t].length<=20000,'Table absente ou trop volumineuse : '+t);const ids=new Set();for(const r of s[t]){assert(r&&text(r.id,100)&&!ids.has(r.id),'Identifiant absent ou dupliqué : '+t);ids.add(r.id);if(r.note!==undefined)assert(typeof r.note==='string'&&r.note.length<=3000,'Note trop longue.');}}
s.activities.forEach(r=>{if(r.id==='property'&&r.name==='Immobilier')r.name='Service';assert(text(r.name,100)&&['goods','service'].includes(r.kind),'Activité invalide.');});
s.contacts.forEach(r=>assert(text(r.name,100)&&typeof r.phone==='string'&&r.phone.length<=60,'Contact invalide.'));
s.suppliers.forEach(r=>assert(text(r.name,100)&&typeof r.phone==='string'&&r.phone.length<=60&&typeof (r.note||'')==='string','Fournisseur invalide.'));
s.products.forEach(r=>assert(text(r.name,100)&&get(s,'activities',r.activity)&&num(r.price)&&Number.isInteger(r.price)&&num(r.threshold)&&typeof r.unit==='string','Produit invalide.'));
s.lots.forEach(r=>assert(get(s,'products',r.product)&&text(r.name,100)&&num(r.qty,1,1000000)&&Number.isInteger(r.qty)&&num(r.loss??0,0,r.qty)&&Number.isInteger(r.loss??0)&&num(r.cost)&&Number.isInteger(r.cost)&&date(r.date)&&(!r.expiry||date(r.expiry))&&(!r.expiry||r.expiry>=r.date),'Lot invalide : quantité, dates ou produit.'));
for(const t of ['sales','deals','expenses'])for(const r of s[t]){assert(date(r.date)&&statusIds.has(r.status)&&get(s,'activities',r.activity),'Date, activité ou statut invalide.');assert(!r.contact||get(s,'contacts',r.contact),'Contact absent.');assert(!r.due||date(r.due),'Échéance invalide.');}
s.sales.forEach(r=>{assert(Array.isArray(r.lines)&&r.lines.length>0&&r.lines.length<=100,'Ajoutez au moins une ligne.');r.lines.forEach(l=>{const lot=get(s,'lots',l.lot),p=lot&&get(s,'products',lot.product);assert(lot&&p&&p.activity===r.activity&&num(l.qty,1,1000000)&&Number.isInteger(l.qty)&&num(l.price)&&Number.isInteger(l.price),'Ligne de vente invalide.');if(effect(s,r)==='valid')assert(lot.date<=r.date&&(!lot.expiry||lot.expiry>=r.date),'Lot indisponible ou périmé à la date de vente.');});assert(total(r)<=1e12,'Total trop élevé.');});
s.deals.forEach(r=>assert(text(r.name,150)&&num(r.base)&&Number.isInteger(r.base)&&num(r.rate,0,100)&&num(r.share,0,100),'Dossier ou commission invalide.'));
s.expenses.forEach(r=>assert(text(r.name,150)&&num(r.amount,1)&&Number.isInteger(r.amount),'Dépense invalide.'));
s.payments.forEach(r=>{const t=r.type==='sale'?'sales':r.type==='deal'?'deals':null;const ref=t&&get(s,t,r.ref);assert(ref&&effect(s,ref)==='valid'&&num(r.amount,1)&&Number.isInteger(r.amount)&&date(r.date)&&r.date>=ref.date&&['cash','mobile','bank'].includes(r.method),'Encaissement invalide : document validé et date postérieure requis.');});
for(const t of ['sales','deals'])for(const r of s[t])assert(paid(s,t==='sales'?'sale':'deal',r.id)<=(t==='sales'?total(r):commission(r)),'Les encaissements dépassent le montant du document.');
s.lots.forEach(l=>assert(stock(s,l.id)>=0,'Stock insuffisant pour le lot '+l.name));
assert(num(s.revision)&&Number.isInteger(s.revision),'Révision invalide.');return s;
}
function metrics(s,query={}){
const scope=r=>(!query.activity||r.activity===query.activity)&&(!query.from||r.date>=query.from)&&(!query.to||r.date<=query.to);
const sales=s.sales.filter(r=>effect(s,r)==='valid'&&scope(r));const deals=s.deals.filter(r=>effect(s,r)==='valid'&&scope(r));
const payments=s.payments.filter(p=>{const r=get(s,p.type==='sale'?'sales':'deals',p.ref);return (!query.activity||r.activity===query.activity)&&(!query.from||p.date>=query.from)&&(!query.to||p.date<=query.to);});
const expenses=s.expenses.filter(r=>effect(s,r)==='valid'&&scope(r));
const revenue=sales.reduce((n,r)=>n+total(r),0),fees=deals.reduce((n,r)=>n+commission(r),0),received=payments.reduce((n,p)=>n+p.amount,0),out=expenses.reduce((n,r)=>n+r.amount,0);
const cost=sales.reduce((n,r)=>n+r.lines.reduce((m,l)=>m+l.qty*get(s,'lots',l.lot).cost,0),0);
const pending=sales.reduce((n,r)=>n+total(r)-paid(s,'sale',r.id),0)+deals.reduce((n,r)=>n+commission(r)-paid(s,'deal',r.id),0);

function commit(s,table,record,action='save'){

if(action==='delete'){assert(i>=0,'Élément absent.');next[table].splice(i,1);}else if(i<0)next[table].push(record);else next[table][i]=record;
next.revision++;next.updatedAt=new Date().toISOString();next.audit.unshift({id:uid(),at:next.updatedAt,action:`${action==='delete'?'Suppression':i<0?'Création':'Modification'} · ${table}`,record:record.id});next.audit=next.audit.slice(0,5000);return validate(next);
}
function restore(raw){assert(typeof raw==='string'&&raw.length<10*1024*1024,'Sauvegarde trop volumineuse (10 Mo maximum).');let s;try{s=JSON.parse(raw);}catch{throw Error('Le fichier JSON est illisible.');}return validate(s);}
function csv(rows){const cell=v=>{let x=String(v??'');if(/^[=+@\-\t\r]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"';};return '\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n');}
function demo(mode='mixed'){const s=empty(),d=today();s.settings.onboard=true;s.settings.demo=true;s.settings.businessMode=mode;if(mode==='goods')s.activities=s.activities.filter(a=>a.kind==='goods');if(mode==='service')s.activities=s.activities.filter(a=>a.kind==='service');s.contacts=[{id:'c1',name:'Rasoa (démo)',phone:'034 00 000 00'},{id:'c2',name:'Client immobilier (démo)',phone:''}];s.suppliers=[{id:'sp1',name:'Laiterie locale (démo)',phone:'034 00 000 01',note:'Fournisseur fictif'}];if(mode!=='service'){s.products=[{id:'p1',name:mode==='goods'?'Robe friperie (démo)':'Yaourt nature 125 ml',activity:'yogurt',price:1500,unit:'pot',threshold:20},{id:'p2',name:mode==='goods'?'Assiette (démo)':'Yaourt vanille 250 ml',activity:'yogurt',price:2500,unit:'pot',threshold:15}];const future=new Date();future.setDate(future.getDate()+7);const exp=future.toISOString().slice(0,10);s.lots=[{id:'l1',name:'Production A',product:'p1',qty:100,cost:800,date:d,expiry:exp},{id:'l2',name:'Production B',product:'p2',qty:60,cost:1300,date:d,expiry:exp}];s.sales=[{id:'s1',activity:'yogurt',date:d,due:d,contact:'c1',status:'valid',note:'Commande de démonstration',lines:[{lot:'l1',qty:30,price:1500},{lot:'l2',qty:10,price:2500}]}];s.payments.push({id:'r1',type:'sale',ref:'s1',date:d,amount:50000,method:'mobile'});s.expenses.push({id:'e1',name:'Approvisionnement / production',activity:'yogurt',date:d,status:'valid',amount:158000,note:'Exemple fictif'});}if(mode!=='goods'){s.deals=[{id:'d1',name:'Location — appartement Ankorondrano',activity:'property',date:d,due:d,contact:'c2',status:'valid',base:1200000,rate:50,share:50,note:'Exemple : commission partagée à 50 %.'}];s.payments.push({id:'r2',type:'deal',ref:'d1',date:d,amount:150000,method:'bank'});s.expenses.push({id:'e2',name:'Déplacement visite',activity:'property',date:d,status:'valid',amount:12000});}return validate(s);}

function writeStore(next,expected){if(storageMode==='local'){try{const old=localStorage.getItem('biznako:current');const current=old?JSON.parse(old):null;if(current&&current.revision!==expected)return Promise.reject(Error('Données modifiées dans une autre fenêtre. Rechargez avant de continuer.'));if(current)localStorage.setItem('biznako:previous',old);localStorage.setItem('biznako:current',JSON.stringify(next));return Promise.resolve();}catch(e){return Promise.reject(Error('Enregistrement local impossible. Le stockage du navigateur est bloqué ou plein ; exportez une sauvegarde si disponible.'));}}return new Promise((res,rej)=>{const tx=db.transaction('data','readwrite'),store=tx.objectStore('data');let conflict=false;const r=store.get('current');r.onsuccess=()=>{if(r.result&&r.result.revision!==expected){conflict=true;tx.abort();return;}if(r.result)store.put(r.result,'previous');store.put(next,'current');};tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(conflict?Error(t('Données modifiées dans une autre fenêtre. Rechargez avant de continuer.','Niova tao amin’ny varavarankely hafa ny angona. Avereno sokafana.')):tx.error||Error('Écriture annulée.'));});}
function writeAux(value,key){if(storageMode==='local'){try{if(value===null)localStorage.removeItem('biznako:'+key);else localStorage.setItem('biznako:'+key,JSON.stringify(value));return Promise.resolve()}catch{return Promise.reject(Error('Stockage local indisponible.'))}}return new Promise((res,rej)=>{const tx=db.transaction('data','readwrite'),store=tx.objectStore('data');if(value===null)store.delete(key);else store.put(value,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}

v class="panel-head"><h2>${t('Dernières ventes','Varotra farany')}</h2>${btn(t('Tout voir','Hijery rehetra'),'nav','data-view="sales"')}</div>${state.sales.length?`<div class="mini-list">${[...state.sales].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(r=>`<div class="mini-item"><div><strong>${esc(name('contacts',r.contact))}</strong><small>${fmt(r.date)} · ${status(r)}</small></div><div class="inline"><span class="amount">${money(B.total(r))}</span>${btn('↗','document',`data-table="sales" data-id="${esc(r.id)}" aria-label="${t('Ouvrir le document','Hanokatra taratasy')}"`)}</div></div>`).join('')}</div>`:emptyMessage('sales')}</section><section class="card"><h2>${t('Les bons réflexes','Fomba tsara')}</h2><div class="guide-step"><span class="step-num">1</span><div><strong>${t('Enregistrez vos encaissements','Raketo ny vola voaray')}</strong><p class="small muted">${t('Une vente validée n’est pas forcément payée.','Tsy voatery ho voaloa ny varotra voamarina.')}</p></div></div><div class="guide-step"><span class="step-num">2</span><div><strong>${t('Gardez une copie de vos données','Tehirizo ny dika mitovin’ny angona')}</strong><p class="small muted">${t('Exportez régulièrement une sauvegarde JSON.','Manaova tahiry JSON matetika.')}</p></div></div>${btn(t('Sauvegarder maintenant','Hanao tahiry izao'),'backup')}</section></div>`;}
function activityBars(){const rows=state.activities.filter(a=>!query.activity||query.activity===a.id).map(a=>{const m=B.metrics(state,{...query,activity:a.id});return {a,v:m.revenue+m.fees};});const max=Math.max(1,...rows.map(r=>r.v));return rows.map(r=>`<div class="bar-row"><span>${esc(r.a.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${r.v/max*100}%"></div></div><span class="bar-value">${money(r.v)}</span></div>`).join('');}
function stockAlerts(){const list=[];state.products.forEach(p=>{const lots=state.lots.filter(l=>l.product===p.id),usable=lots.filter(l=>(!l.expiry||l.expiry>=B.today())&&l.date<=B.today()).reduce((n,l)=>n+B.stock(state,l.id),0);if(usable<=p.threshold)list.push(`${p.name} : ${usable} ${t('disponible(s), seuil','azo amidy, fetra')} ${p.threshold}.`);});state.lots.filter(l=>l.expiry&&B.stock(state,l.id)>0&&l.expiry<=addDays(3)).forEach(l=>list.push(`${l.name} : ${t(l.expiry<B.today()?'périmé le':'expire le',l.expiry<B.today()?'lany daty ny':'ho lany daty ny')} ${fmt(l.expiry)} (${B.stock(state,l.id)}).`));return list;}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function emptyMessage(table){return `<div class="empty"><strong>${t('Tout commence ici.','Eto no manomboka.')}</strong><p>${t('Ajoutez votre premier élément pour commencer.','Ampidiro ny singa voalohany.')}</p>${btn('+ '+t('Ajouter','Hanampy'),'add',`data-table="${table}"`,'primary')}</div>`;}
function rowAmount(table,r){if(table==='sales')return B.total(r);if(table==='deals')return B.commission(r);return r.amount??r.price??r.cost??0;}
function rowActivity(table,r){if(table==='lots')return B.get(state,'products',r.product)?.activity;if(table==='payments')return B.get(state,r.type==='sale'?'sales':'deals',r.ref)?.activity;return r.activity;}
function filtered(table){return state[table].filter(r=>{const all=[r.name,r.note,name('contacts',r.contact),r.id,table==='lots'?name('products',r.product):'',table==='payments'?r.ref:''].join(' ').toLocaleLowerCase();const text=query.field==='name'?String(r.name||'').toLocaleLowerCase():query.field==='note'?String(r.note||'').toLocaleLowerCase():query.field==='id'?String(r.id||'').toLocaleLowerCase():all;return (!query.q||text.includes(query.q.toLocaleLowerCase()))&&(!query.activity||rowActivity(table,r)===query.activity||table==='contacts')&&(!query.status||r.status===query.status)&&(!query.from||!r.date||r.date>=query.from)&&(!query.to||!r.date||r.date<=query.to);}).sort((a,b)=>query.sort==='name'?(a.name||name('contacts',a.contact)).localeCompare(b.name||name('contacts',b.contact)):query.sort==='name-desc'?(b.name||name('contacts',b.contact)).localeCompare(a.name||name('contacts',a.contact)):query.sort==='amount-asc'?rowAmount(table,a)-rowAmount(table,b):query.sort==='amount'?rowAmount(table,b)-rowAmount(table,a):query.sort==='date-asc'?(a.date||'').localeCompare(b.date||''):(b.date||'').localeCompare(a.date||''));}
function listColumns(table){return {sales:[t('Document / Client','Taratasy / Mpanjifa'),t('Date / Échéance','Daty / Fe-potoana'),t('Montant','Vola'),t('Reste dû','Mbola aloa'),t('Statut','Sata')],products:[t('Produit','Vokatra'),t('Activité','Asa'),t('Prix unitaire','Vidiny'),t('Stock total','Tahiry rehetra'),t('Seuil','Fetra')],lots:[t('Lot / Produit','Andiany / Vokatra'),t('Production','Famokarana'),t('Péremption','Fahataperana'),t('Reste / initial','Sisa / voalohany'),t('Coût unitaire','Sanda isanisany')],deals:[t('Dossier / Client','Raharaha / Mpanjifa'),t('Date / Échéance','Daty / Fe-potoana'),t('Votre commission','Ny tambinao'),t('Reste dû','Mbola aloa'),t('Statut','Sata')],payments:[t('Document','Taratasy'),t('Date','Daty'),t('Montant reçu','Vola voaray'),t('Mode','Fomba')],expenses:[t('Libellé','Anarana'),t('Date','Daty'),t('Montant','Vola'),t('Activité','Asa'),t('Statut','Sata')],contacts:[t('Nom','Anarana'),t('Téléphone','Finday'),t('Note','Fanamarihana')],suppliers:[t('Fournisseur','Mpamatsy'),t('Téléphone','Finday'),t('Note','Fanamarihana')]}[table];}
function rowCells(table,r,plain=false){const st=plain?state.statuses.find(s=>s.id===r.status)?.label:status(r),label=esc(r.name),contact=esc(name('contacts',r.contact));switch(table){case'sales':return [`${esc(r.id.slice(-7).toUpperCase())}<small>${contact}</small>`,`${fmt(r.date)}<small>${fmt(r.due)}</small>`,money(B.total(r)),money(B.total(r)-B.paid(state,'sale',r.id)),st];case'deals':return [`${label}<small>${contact}</small>`,`${fmt(r.date)}<small>${fmt(r.due)}</small>`,money(B.commission(r)),money(B.commission(r)-B.paid(state,'deal',r.id)),st];case'products':return [label,esc(name('activities',r.activity)),money(r.price),String(state.lots.filter(l=>l.product===r.id).reduce((n,l)=>n+B.stock(state,l.id),0)),String(r.threshold)];case'lots':return [`${label}<small>${esc(name('products',r.product))}</small>`,fmt(r.date),`<span class="${r.expiry&&r.expiry<B.today()?'negative':''}">${fmt(r.expiry)}</span>`,`${B.stock(state,r.id)} / ${r.qty}<small>${t('Pertes','Fatiantoka')} : ${r.loss||0}</small>`,money(r.cost)];case'payments':return [esc(r.ref.slice(-7).toUpperCase()),fmt(r.date),money(r.amount),methodName(r.method)];case'expenses':return [label,fmt(r.date),money(r.amount),esc(name('activities',r.activity)),st];case'contacts':return [label,esc(r.phone),esc(r.note||'')];case'suppliers':return [label,esc(r.phone),esc(r.note||'')];}}
function methodName(k){return {cash:t('Espèces','Vola mivantana'),mobile:'Mobile Money',bank:t('Banque','Banky')}[k]||k;}
function listView(){const rows=filtered(view),maxPage=Math.max(0,Math.ceil(rows.length/15)-1);page=Math.min(page,maxPage);const slice=rows.slice(page*15,page*15+15);return filterUI()+`<section class="card"><div class="panel-head"><h2>${rows.length} ${t('élément(s)','singa')}</h2><div class="inline">${btn('CSV','csv')}${btn(t('Imprimer / PDF','Hanonta / PDF'),'printList')}</div></div>${view==='lots'?`<p class="small muted">${t('Le coût des lots sert à calculer la marge. Enregistrez séparément les paiements de production dans Dépenses. Les lots périmés restent visibles et sont bloqués à la vente.','Ny sandan’ny andiany dia ampiasaina hikajiana ny tombony. Raketo ao amin’ny Fandaniana ny vola naloa tamin’ny famokarana. Tsy azo amidy ny lany daty.')}</p>`:''}${rows.length?`<div class="table-wrap"><table><thead><tr>${listColumns(view).map(c=>`<th>${c}</th>`).join('')}<th>${t('Actions','Hetsika')}</th></tr></thead><tbody>${slice.map(r=>`<tr>${rowCells(view,r).map(c=>`<td>${c}</td>`).join('')}<td><div class="row-actions">${btn('⋯','actions',`data-table="${view}" data-id="${esc(r.id)}" aria-label="${t('Actions sur cet élément','Hetsika amin’ity singa ity')}"`)}</div></td></tr>`).join('')}</tbody>${['sales','deals','expenses','payments'].includes(view)?`<tfoot><tr><td colspan="2">${t('Total filtré (tous statuts)','Fitambarany (sata rehetra)')}</td><td colspan="4">${money(rows.reduce((n,r)=>n+rowAmount(view,r),0))}</td></tr></tfoot>`:''}</table></div><div class="pagination">${btn('← '+t('Précédent','Teo aloha'),'prev',page===0?'disabled':'')}<span>${page+1} / ${maxPage+1}</span>${btn(t('Suivant','Manaraka')+' →','next',page===maxPage?'disabled':'')}</div>`:query.q||query.activity||query.status||query.from||query.to?`<div class="empty">${t('Aucun résultat pour ces filtres.','Tsy misy valiny amin’ireo sivana.')}</div>`:emptyMessage(view)}</section>`;}
function receivables(){const m=B.metrics(state,query);const rows=[...m.sales.map(r=>({r,table:'sales',type:'sale',amount:B.total(r)})),...m.deals.map(r=>({r,table:'deals',type:'deal',amount:B.commission(r)}))].map(x=>({...x,left:x.amount-B.paid(state,x.type,x.r.id)})).filter(x=>x.left>0).sort((a,b)=>(a.r.due||'9999').localeCompare(b.r.due||'9999'));return filterUI(false)+`<section class="card"><div class="panel-head"><h2>${t('Documents non soldés','Taratasy mbola tsy voaloa')}</h2><strong>${money(rows.reduce((n,x)=>n+x.left,0))}</strong></div><div class="table-wrap"><table><thead><tr><th>${t('Client / dossier','Mpanjifa / raharaha')}</th><th>${t('Échéance','Fe-potoana')}</th><th>${t('Reste','Sisa')}</th><th>${t('Actions','Hetsika')}</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.r.name||name('contacts',x.r.contact))}<small>${esc(x.r.id.slice(-7).toUpperCase())}</small></td><td class="${x.r.due&&x.r.due<B.today()?'negative':''}">${fmt(x.r.due)}</td><td>${money(x.left)}</td><td><div class="row-actions">${btn(t('Encaisser','Handray vola'),'pay',`data-table="${x.table}" data-id="${esc(x.r.id)}"`)}${btn('↗','document',`data-table="${x.table}" data-id="${esc(x.r.id)}" aria-label="${t('Ouvrir le document','Hanokatra taratasy')}"`)}</div></td></tr>`).join('')||`<tr><td colspan="4">${t('Aucun document à encaisser.','Tsy misy taratasy mbola horaisina vola.')}</td></tr>`}</tbody></table></div></section>`;}
function reports(){const m=B.metrics(state,query),months={};for(const p of m.payments){months[p.date.slice(0,7)]??={in:0,out:0};months[p.date.slice(0,7)].in+=p.amount;}for(const e of m.expenses){months[e.date.slice(0,7)]??={in:0,out:0};months[e.date.slice(0,7)].out+=e.amount;}return filterUI(false)+`<div class="grid kpis">${kpi(t('Encaissements','Vola voaray'),m.received,t('À la date du paiement','Amin’ny daty nandoavana'),'payments')}${kpi(t('Dépenses payées','Fandaniana voaloa'),m.out,t('Statut validé uniquement','Sata voamarina ihany'),'expenses')}${kpi(t('Marge brute produits','Tombony manta vokatra'),m.margin,t('Ventes − coût des unités vendues','Varotra − sandan’ny vokatra lafo'),'sales')}${kpi(t('Coût des produits vendus','Sandan’ny vokatra lafo'),m.cost,t('Coûts unitaires des lots','Sanda isanisany amin’ny andiany'),'lots')}</div><div class="grid two"><section class="card"><h2>${t('Flux mensuels','Fiovan’ny vola isam-bolana')}</h2><div class="table-wrap"><table><thead><tr><th>${t('Mois','Volana')}</th><th>${t('Entrées','Miditra')}</th><th>${t('Sorties','Mivoaka')}</th><th>Net</th></tr></thead><tbody>${Object.keys(months).sort().map(k=>`<tr><td>${k.split('-').reverse().join('/')}</td><td>${money(months[k].in)}</td><td>${money(months[k].out)}</td><td>${money(months[k].in-months[k].out)}</td></tr>`).join('')||`<tr><td colspan="4">${t('Aucun mouvement.','Tsy misy fiovana.')}</td></tr>`}</tbody></table></div></section><section class="card"><h2>${t('Contribution par activité','Anjara isaky ny asa')}</h2>${activityBars()}<p class="small muted">${t('La marge brute exclut les frais généraux. Le flux net n’est pas un solde bancaire : il ne comprend pas de solde d’ouverture.','Tsy tafiditra amin’ny tombony manta ny fandaniana ankapobeny. Tsy saldon’ny banky ny fiovan’ny vola: tsy misy saldo fanombohana.')}</p></section></div><div class="inline no-print">${btn(t('Imprimer / PDF','Hanonta / PDF'),'printReport')}${btn(t('Exporter les flux CSV','Hamoaka fiovana CSV'),'cashCSV')}</div>`;}
function settings(){return `<div class="grid settings-grid"><section class="card stack"><h2>${t('Préférences','Safidy')}</h2><form id="prefs" class="stack"><label>${t('Nom commercial','Anaran’ny orinasa')}<input name="name" required maxlength="100" value="${esc(state.settings.name)}"></label><label class="check"><input name="assistant" type="checkbox" ${state.settings.assistant?'checked':''}>${t('Activer les conseils locaux','Hampandeha torohevitra eo an-toerana')}</label><button class="primary">${t('Enregistrer','Hitahiry')}</button></form><h3>${t('Type d’activité','Karazan’asa')}</h3><label>${t('Profil principal','Safidy lehibe')}<select name="businessMode" form="prefs"><option value="goods" ${state.settings.businessMode==='goods'?'selected':''}>${t('Commerce de biens','Varotra entana')}</option><option value="service" ${state.settings.businessMode==='service'?'selected':''}>${t('Services uniquement','Tolotra ihany')}</option><option value="mixed" ${state.settings.businessMode==='mixed'?'selected':''}>${t('Mixte : biens et services','Mifangaro: entana sy tolotra')}</option></select></label><p class="small muted">${t('Le profil adapte les exemples et l’accueil. Il ne supprime aucune donnée déjà saisie.','Manova ny ohatra sy ny fandraisana ny safidy. Tsy mamafa angona efa voarakitra.')}</p><h3>${t('Tables visibles','Tabilao aseho')}</h3><p class="small muted">${t('Décochez les rubriques inutilisées. Les données sont conservées et réapparaissent si vous réactivez la table.','Esory ny marika amin’ny sokajy tsy ampiasaina. Voatahiry ny angona ary miseho indray rehefa alefa.')}</p><div class="table-toggles">${menus.filter(([v])=>B.tables.includes(v)||['reports','assistant','audit'].includes(v)).map(([v,ic,fr,mg])=>`<label class="check"><input type="checkbox" name="enabledTable" value="${v}" form="prefs" ${state.settings.enabledTables?.[v]!==false?'checked':''}>${t(fr,mg)}</label>`).join('')}</div><p class="small muted">${t('Devise : Ariary (MGA), sans décimales. Dates : jj/mm/aaaa.','Vola: Ariary (MGA), tsy misy desimaly. Daty: jj/mm/aaaa.')}</p><h3>${t('Rappel Android','Fampahatsiahivana Android')}</h3><p class="small muted">${t('Un rappel local pour enregistrer vos opérations. Autorisation demandée uniquement à l’activation.','Fampahatsiahivana eo an-toerana mba handraketana ny asa. Angatahana ny alalana rehefa alefa ihany.')}</p><div class="inline">${btn(t('Me rappeler demain à 18 h','Ampahatsiahivo rahampitso amin’ny 18 ora'),'reminder',native()?'':'disabled')}${btn(t('Annuler le rappel','Hanafoana fampahatsiahivana'),'cancelReminder',native()?'':'disabled')}</div>${!native()?`<p class="small muted">${t('Disponible dans l’application Android uniquement.','Ao amin’ny rindranasa Android ihany.')}</p>`:''}</section><section class="card stack"><h2>${t('Sauvegarde & restauration','Tahiry sy famerenana')}</h2><p class="sub">${t('Les données sont d’abord enregistrées sur cet appareil, puis synchronisées automatiquement avec AppForge Cloud si vous vous connectez. Le mode hors ligne reste disponible.','Tehirizina eto aloha ny angona, avy eo ampifanarahana amin’ny AppForge Cloud raha miditra ianao. Azo ampiasaina tsy misy Internet.')}</p>${btn(t('Exporter la sauvegarde JSON','Hamoaka tahiry JSON'),'backup','', 'primary')}<label>${t('Restaurer une sauvegarde JSON (10 Mo max.)','Hamerina tahiry JSON (10 Mo farany)')}<input type="file" id="restore" accept=".json,application/json"></label>${btn(t('Récupérer la version locale précédente','Hamerina ny tahiry teo aloha'),'recover')}<p class="small muted">${t('Une copie précédente est conservée à chaque écriture. Elle reste sur ce même appareil.','Voatahiry ny dika teo aloha isaky ny fanovana. Eto amin’ity fitaovana ity ihany.')}</p>${btn(t('Charger la démonstration','Hampiditra demo'),'demo')}${btn(t('Effacer toutes les données','Hamafa ny angona rehetra'),'reset','','danger')}</section><section class="card stack"><div class="panel-head"><h2>${t('Mes activités','Ny asako')}</h2>${btn('+','add','data-table="activities" aria-label="Ajouter une activité"')}</div>${state.activities.map(a=>`<div class="mini-item"><div><strong>${esc(a.name)}</strong><small>${a.kind==='goods'?t('Produits / stock','Vokatra / tahiry'):t('Services / commissions','Tolotra / tambiny')}</small></div>${btn('⋯','actions',`data-table="activities" data-id="${esc(a.id)}"`)}</div>`).join('')}<div class="panel-head"><h3>${t('Statuts personnalisés','Sata manokana')}</h3>${btn('+','statusAdd','aria-label="Ajouter un statut"')}</div><p class="small muted">${t('Chaque statut utilise une règle : brouillon, validé ou annulé. Les règles existantes ne sont pas modifiées rétroactivement.','Ny sata tsirairay dia manaraka fitsipika: drafitra, voamarina na nofoanana.')}</p>${state.statuses.map(s=>`<div class="mini-item"><span>${esc(stLabel(s))}<small>${esc(s.effect)}</small></span>${!['draft','valid','cancel'].includes(s.id)?btn('×','statusDelete',`data-id="${esc(s.id)}" aria-label="Supprimer le statut"`):''}</div>`).join('')}</section>${licenseCloudSettingsCard()}</div>`;}

function edit(table,id=null,duplicate=false){let r=id?B.clone(B.get(state,table,id)):{id:B.uid()};if(!r)return;if(duplicate){r.id=B.uid();r.status='draft';r.date=B.today();}let fields='';const defaults={date:B.today(),status:'draft',activity:state.activities[0]?.id,phone:''};r={...defaults,...r};const contact=()=>select(t('Client / contact','Mpanjifa / fifandraisana'),'contact',state.contacts,r.contact,true);const activity=()=>select(t('Activité','Asa'),'activity',state.activities,r.activity);const stat=()=>select(t('Statut','Sata'),'status',state.statuses,r.status,false,stLabel);const date=()=>field(t('Date','Daty'),'date',r.date,'date','required');const notes=()=>`<label class="full">${t('Note','Fanamarihana')}<textarea name="note" maxlength="3000">${esc(r.note||'')}</textarea></label>`;const amount=(label,key,value,min=0,step=1)=>field(label,key,value??0,'number',`required min="${min}" max="1000000000000" step="${step}"`);

if(table==='payments'){const docs=[...state.sales.filter(x=>B.effect(state,x)==='valid').map(x=>({id:'sale:'+x.id,name:`${t('Vente','Varotra')} ${x.id.slice(-7)} · ${name('contacts',x.contact)} · ${money(B.total(x)-B.paid(state,'sale',x.id))}`})),...state.deals.filter(x=>B.effect(state,x)==='valid').map(x=>({id:'deal:'+x.id,name:`${x.name} · ${money(B.commission(x)-B.paid(state,'deal',x.id))}`}))];if(!docs.length){toast(t('Validez d’abord une vente ou un dossier.','Hamarino aloha ny varotra na raharaha.'));return;}fields=select(t('Document à régler / reste dû','Taratasy handoavana / sisa'),'document',docs,r.type+':'+r.ref)+date()+amount(t('Montant reçu (Ar)','Vola voaray (Ar)'),'amount',r.amount??1,1)+select(t('Moyen de paiement','Fomba fandoavana'),'method',['cash','mobile','bank'].map(id=>({id,name:methodName(id)})),r.method||'cash')+notes();}

const APPFORGE_LICENSE_API='https://appforge-license-api.appforge-licences-mg.workers.dev';
const BIZNAKO_PRODUCT_ID='BIZNAKO';
const LICENSE_VAULT_KEY='biznako-license-cloud-v1';
let licenseVault={version:1,installationId:'',licenseToken:'',cloudToken:'',publicKey:null,licenseExpiresAt:null,cloudExpiresAt:null,licenseKind:'',lastSyncAt:null};
let licenseToken='',cloudToken='',installationId='',licensePublicKey=null,licenseExpiresAt=null,cloudExpiresAt=null,licenseKind='',licenseStatus='inactive',licenseError='',syncTimer=0,syncBusy=false,applyingCloud=false,syncMessage='Licence non activée.';

function bytesToBase64(bytes){let binary='';for(const b of bytes)binary+=String.fromCharCode(b);return btoa(binary)}
function base64ToBytes(value){return Uint8Array.from(atob(value),c=>c.charCodeAt(0))}
async function webVaultKey(){if(storageMode!=='idb'||!crypto?.subtle)throw Error(t('Le stockage Cloud sécurisé nécessite IndexedDB et WebCrypto dans ce navigateur.','Mila IndexedDB sy WebCrypto ny fitahirizana Cloud azo antoka amin’ity navigateur ity.'));let key=await readStore('biznako-cloud-vault-key');if(!key){key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await writeAux(key,'biznako-cloud-vault-key')}return key}
async function secureVaultRead(){if(native()){const result=await bridge().getSecureValue({key:LICENSE_VAULT_KEY});return result?.value?JSON.parse(result.value):null}if(storageMode!=='idb')throw Error(t('Le Cloud est indisponible : activez le stockage sécurisé du navigateur.','Tsy misy ny Cloud: alefaso ny fitahirizana azo antoka an’ny navigateur.'));const record=await readStore('biznako-cloud-vault');if(!record)return null;const key=await webVaultKey(),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:base64ToBytes(record.iv)},key,base64ToBytes(record.ciphertext));return JSON.parse(new TextDecoder().decode(plain))}
async function secureVaultWrite(){const value=JSON.stringify(licenseVault);if(native()){await bridge().setSecureValue({key:LICENSE_VAULT_KEY,value});return}if(storageMode!=='idb')throw Error(t('Le Cloud est indisponible : le stockage local de secours ne protège pas les jetons.','Tsy misy ny Cloud: tsy miaro jeton ny fitahirizana vonjimaika.'));const key=await webVaultKey(),iv=crypto.getRandomValues(new Uint8Array(12)),ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(value));await writeAux({iv:bytesToBase64(iv),ciphertext:bytesToBase64(new Uint8Array(ciphertext))},'biznako-cloud-vault')}
function loadVault(value){licenseVault={...licenseVault,...(value||{})};licenseToken=licenseVault.licenseToken||'';cloudToken=licenseVault.cloudToken||'';installationId=licenseVault.installationId||'';licensePublicKey=licenseVault.publicKey||null;licenseExpiresAt=licenseVault.licenseExpiresAt||null;cloudExpiresAt=licenseVault.cloudExpiresAt||null;licenseKind=licenseVault.licenseKind||'';licenseStatus=licenseToken?'checking':'inactive'}
async function saveVault(){licenseVault={...licenseVault,version:1,installationId,licenseToken,cloudToken,publicKey:licensePublicKey,licenseExpiresAt,cloudExpiresAt,licenseKind};await secureVaultWrite()}
async function ensureInstallationId(){if(installationId)return installationId;installationId=crypto?.randomUUID?crypto.randomUUID():'bizn-'+Date.now().toString(36)+'-'+bytesToBase64(crypto.getRandomValues(new Uint8Array(24))).replace(/[+/=]/g,'');await saveVault();return installationId}
async function readClaims(token){try{const parts=String(token||'').split('.');if(parts.length!==2)throw Error();const payload=parts[0].replace(/-/g,'+').replace(/_/g,'/');const claims=JSON.parse(new TextDecoder().decode(base64ToBytes(payload)));if(!licensePublicKey)throw Error();const key=await crypto.subtle.importKey('jwk',licensePublicKey,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);const valid=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,base64ToBytes(parts[1].replace(/-/g,'+').replace(/_/g,'/')),new TextEncoder().encode(parts[0]));if(!valid||(claims.exp&&Date.parse(claims.exp)<=Date.now())||claims.app!==BIZNAKO_PRODUCT_ID||claims.install!==await installationDigest(installationId))throw Error();return claims}catch{return null}}
async function installationDigest(value){const data=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));return Array.from(new Uint8Array(data)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function licenseRequest(path,payload){const response=await fetch(APPFORGE_LICENSE_API+path,{method:'POST',cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(15000),headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok){const err=Error(data.error||t('Le service de licence a refusé la demande.','Nolavin’ny serivisy fahazoan-dalana ny fangatahana.'));err.status=response.status;throw err}return data}
async function cloudRequest(path,options={}){if(!cloudToken)throw Error(t('Aucun jeton Cloud valide. Activez ou vérifiez la licence.','Tsy misy jeton Cloud manankery. Alefaso na hamarino ny fahazoan-dalana.'));const response=await fetch(APPFORGE_LICENSE_API+path,{method:options.method||'GET',cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(15000),headers:{'Authorization':'Bearer '+cloudToken,'Content-Type':'application/json'},body:options.body});const data=await response.json().catch(()=>({}));if(!response.ok){const err=Error(data.error||t('La synchronisation Cloud a échoué.','Tsy nahomby ny fampifanarahana Cloud.'));err.status=response.status;err.data=data;throw err}return data}
function formatExpiry(value){if(!value)return licenseToken?t('À vie','Maharitra'):'—';const date=new Date(value);return Number.isNaN(date.getTime())?'—':date.toLocaleDateString(state?.settings?.lang==='mg'?'mg-MG':'fr-FR')}
function licenseLabel(){return ({active:t('Active','Mavitrika'),offline:t('Valide hors ligne','Manankery ivelan’ny aterineto'),expired:t('Expirée','Lany daty'),revoked:t('Révoquée ou suspendue','Nofoanana na naato'),checking:t('Vérification…','Manamarina…'),inactive:t('Non activée','Tsy mbola navadika'),error:t('À vérifier','Hamarino')})[licenseStatus]||t('À vérifier','Hamarino')}
function cloudTokenValid(){return !!cloudToken&&!!cloudExpiresAt&&Date.parse(cloudExpiresAt)>Date.now()}
function cloudStatusLabel(){if(!navigator.onLine)return t('Hors ligne · données locales disponibles','Tsy misy Internet · misy ny angona eo an-toerana');if(cloudTokenValid()&&licenseStatus==='active')return t('Accès Cloud autorisé par la licence','Nahazo alalana Cloud tamin’ny fahazoan-dalana');if(licenseStatus==='active')return t('Licence active · accès Cloud à vérifier','Mavitrika ny fahazoan-dalana · hamarinina ny Cloud');return t('Cloud non connecté · accès local conservé','Tsy mifandray ny Cloud · voatahiry eto an-toerana')}
function licenseSummary(){return licenseLabel()+' · '+t('expiration','fahataperana')+' : '+formatExpiry(licenseExpiresAt)}
function licenseCloudSettingsCard(){return '<section class="card stack"><h2>'+t('Licence & AppForge Cloud','Fahazoan-dalana sy AppForge Cloud')+'</h2><span class="badge '+(licenseStatus==='active'&&cloudTokenValid()?'':'draft')+'">'+esc(cloudStatusLabel())+'</span><dl class="about-list"><div><dt>'+t('Licence','Fahazoan-dalana')+'</dt><dd>'+esc(licenseLabel())+'</dd></div><div><dt>'+t('Expiration','Fahataperana')+'</dt><dd>'+esc(formatExpiry(licenseExpiresAt))+'</dd></div><div><dt>'+t('Droits Cloud','Zo Cloud')+'</dt><dd>'+esc(cloudTokenValid()?t('Autorisé · jeton temporaire valide','Nahazo alalana · manankery ny jeton vonjimaika'):t('Non vérifiés','Tsy mbola voamarina'))+'</dd></div><div><dt>'+t('Dernière synchronisation','Fampifanarahana farany')+'</dt><dd>'+esc(licenseVault.lastSyncAt?new Date(licenseVault.lastSyncAt).toLocaleString():t('Aucune','Tsy mbola nisy'))+'</dd></div></dl><p class="small muted" id="cloudSyncStatus" role="status">'+esc(syncMessage)+'</p><div class="inline">'+btn(t('Licence / essai','Fahazoan-dalana / fitsapana'),'cloudInfo')+btn(t('Synchroniser maintenant','Hampifanaraka izao'),'cloudSyncNow','', 'primary')+'</div><p class="small muted">'+t('La synchronisation démarre après validation serveur de la licence et de cet appareil. Les données restent locales si le réseau ou le Cloud est indisponible.','Manomboka aorian’ny fanamarinana ny fahazoan-dalana sy ny fitaovana ny fampifanarahana. Mijanona eto an-toerana ny angona raha tsy misy tambajotra.')+'</p></section>'}
function openCloudModal(message=''){const active=licenseStatus==='active'&&cloudTokenValid();const forms=!active?'<form id="licenseActivationForm" class="stack"><label>'+t('Code de licence AppForge','Kaody fahazoan-dalana AppForge')+'<input id="licenseCode" name="code" autocomplete="off" maxlength="80" required></label><button class="primary" type="submit">'+t('Activer ma licence','Alefaso ny fahazoan-dalana')+'</button></form><button type="button" data-action="licenseTrial">'+t('Commencer l’essai gratuit de 3 jours','Hanomboka fitsapana maimaim-poana 3 andro')+'</button>':'<button type="button" data-action="cloudSyncNow" class="primary">'+t('Synchroniser maintenant','Hampifanaraka izao')+'</button>';modal(t('Licence & AppForge Cloud','Fahazoan-dalana sy AppForge Cloud'),'<div class="stack"><p>'+t('Le client ne crée aucun compte Cloud et ne choisit aucune organisation. AppForge vérifie la licence et l’appareil, puis délivre un jeton Cloud temporaire.','Tsy mila mamorona kaonty Cloud na misafidy fikambanana ny mpanjifa. Hamarinin’i AppForge ny fahazoan-dalana sy fitaovana, avy eo manome jeton Cloud vonjimaika.')+'</p><section class="card stack"><strong>'+esc(licenseSummary())+'</strong><span class="badge '+(active?'':'draft')+'">'+esc(cloudStatusLabel())+'</span><p class="small muted">'+esc(message||licenseError||syncMessage)+'</p>'+forms+'</section><p class="small muted">'+t('Aucune donnée locale n’est supprimée en cas d’expiration, de révocation ou d’erreur Cloud.','Tsy misy angona eo an-toerana voafafa raha lany daty, nofoanana, na misy hadisoana Cloud.')+'</p></div>');}
async function activateLicense(code){if(!navigator.onLine)throw Error(t('Une connexion Internet est nécessaire pour activer la licence.','Ilaina ny Internet mba hampandehanana ny fahazoan-dalana.'));const id=await ensureInstallationId();const data=await licenseRequest('/v1/activate',{productId:BIZNAKO_PRODUCT_ID,code:String(code||'').trim(),installationId:id});if(!data.ok||!data.token||!data.publicKey)throw Error(t('Le serveur n’a pas confirmé cette licence.','Tsy nanamarina ity fahazoan-dalana ity ny mpizara.'));licenseToken=data.token;licensePublicKey=data.publicKey;cloudToken=data.cloudAccess?.token||'';cloudExpiresAt=data.cloudAccess?.expiresAt||null;licenseExpiresAt=null;licenseKind='license';licenseStatus='checking';await saveVault();await refreshEntitlement();syncStatus(t('Licence validée. Synchronisation Cloud activée.','Voamarina ny fahazoan-dalana. Nalefa ny fampifanarahana Cloud.'));render();await cloudSync();}
async function startLicenseTrial(){if(!navigator.onLine)throw Error(t('Une connexion Internet est nécessaire pour démarrer l’essai.','Ilaina ny Internet hanombohana ny fitsapana.'));const id=await ensureInstallationId();const data=await licenseRequest('/v1/trial',{productId:BIZNAKO_PRODUCT_ID,installationId:id});if(!data.ok||!data.token||!data.publicKey)throw Error(t('Le serveur n’a pas confirmé l’essai.','Tsy nanamarina ny fitsapana ny mpizara.'));licenseToken=data.token;licensePublicKey=data.publicKey;cloudToken=data.cloudAccess?.token||'';cloudExpiresAt=data.cloudAccess?.expiresAt||null;licenseKind='trial';licenseStatus='checking';await saveVault();await refreshEntitlement();syncStatus(t('Essai actif. Le Cloud est vérifié automatiquement.','Mavitrika ny fitsapana. Hamarinin’ny rafitra ho azy ny Cloud.'));render();await cloudSync();}
async function refreshEntitlement(){if(!navigator.onLine)throw Error(t('Connectez-vous à Internet pour vérifier la licence.','Mifandraisa amin’ny Internet hanamarinana ny fahazoan-dalana.'));if(!licenseToken)throw Error(t('Aucune licence n’est enregistrée.','Tsy misy fahazoan-dalana voatahiry.'));const id=await ensureInstallationId();const status=await licenseRequest('/v1/status',{productId:BIZNAKO_PRODUCT_ID,token:licenseToken,installationId:id});if(!status.active){licenseStatus=status.expired?'expired':'revoked';cloudToken='';cloudExpiresAt=null;await saveVault();throw Error(status.error||t('Licence expirée ou révoquée.','Lany daty na nofoanana ny fahazoan-dalana.'));}licenseStatus='active';const claims=await readClaims(licenseToken);if(!claims)throw Error(t('La preuve de licence est invalide.','Tsy manankery ny porofon’ny fahazoan-dalana.'));licenseExpiresAt=claims.exp||null;licenseKind=claims.kind||licenseKind||'license';const access=await licenseRequest('/v1/cloud/token',{productId:BIZNAKO_PRODUCT_ID,installationId:id,licenseToken});if(!access.ok||!access.token||!access.expiresAt)throw Error(t('La licence est active, mais le Worker Cloud n’a pas délivré de jeton.','Mavitrika ny fahazoan-dalana, saingy tsy nanome jeton Cloud ny Worker.'));cloudToken=access.token;cloudExpiresAt=access.expiresAt;licenseStatus='active';licenseError='';await saveVault();return true}
async function renewalToken(){if(!navigator.onLine)throw Error(t('Hors ligne : les opérations restent locales.','Tsy misy Internet: mijanona eto an-toerana ny fanovana.'));if(!licenseToken)throw Error(t('Activez une licence ou l’essai pour synchroniser.','Alefaso ny fahazoan-dalana na fitsapana mba hampifanaraka.'));const id=await ensureInstallationId();const access=await licenseRequest('/v1/cloud/token',{productId:BIZNAKO_PRODUCT_ID,installationId:id,licenseToken});if(!access.ok||!access.token||!access.expiresAt)throw Error(t('Le renouvellement du jeton Cloud a été refusé.','Nolavina ny fanavaozana jeton Cloud.'));cloudToken=access.token;cloudExpiresAt=access.expiresAt;licenseStatus='active';await saveVault()}
async function restoreCloudSession(){try{const saved=await secureVaultRead();if(saved)loadVault(saved);if(!licenseToken){licenseStatus='inactive';syncStatus(t('Licence non activée. Les données restent sur cet appareil.','Tsy mbola navadika ny fahazoan-dalana. Mijanona eto an-toerana ny angona.'));return}if(!installationId)await ensureInstallationId();if(!navigator.onLine){const claims=await readClaims(licenseToken);if(claims){licenseStatus='offline';licenseExpiresAt=claims.exp||null;syncStatus(t('Hors ligne : licence locale vérifiée, synchronisation en attente.','Tsy misy Internet: voamarina eto an-toerana ny fahazoan-dalana, miandry ny fampifanarahana.'));}else{licenseStatus='expired';cloudToken='';syncStatus(t('Licence expirée ou preuve locale indisponible. Les données locales sont conservées.','Lany daty ny fahazoan-dalana na tsy hita ny porofo. Voatahiry ny angona eo an-toerana.'))}return}try{await refreshEntitlement();syncStatus(t('Licence et droit Cloud vérifiés par le serveur.','Voamarina tamin’ny mpizara ny fahazoan-dalana sy zo Cloud.'));queueCloudSync(250)}catch(err){licenseError=err.message;licenseStatus=err.status===403?'revoked':'error';if(err.status===403){cloudToken='';cloudExpiresAt=null;await saveVault().catch(()=>{})}syncStatus(err.status===403?t('Licence expirée, révoquée ou appareil non autorisé. Données locales conservées.','Lany daty, nofoanana na tsy nahazo alalana ny fitaovana. Voatahiry ny angona eo an-toerana.'):t('Vérification Cloud impossible : les données locales restent disponibles.','Tsy afaka manamarina Cloud: mbola azo ampiasaina ny angona eo an-toerana.'))}}catch(err){licenseStatus='error';licenseError=err.message;syncStatus(err.message)}finally{if(state)render()}}
function apiStatusError(err){if(err?.status===401||err?.status===403){licenseStatus='revoked';cloudToken='';cloudExpiresAt=null;saveVault().catch(()=>{});return t('Accès Cloud refusé : vérifiez la licence ou l’appareil. Les données locales sont conservées.','Voarara ny Cloud: hamarino ny fahazoan-dalana na fitaovana. Voatahiry ny angona eo an-toerana.')}if(err?.status===413)return t('La sauvegarde dépasse la limite Cloud. Les données restent locales.','Mihoatra ny fetra Cloud ny tahiry. Mijanona eto an-toerana ny angona.');return err?.message||t('Erreur Cloud. Les données locales sont conservées.','Hadisoana Cloud. Voatahiry ny angona eo an-toerana.')}
const SYNC_TABLES=['activities','statuses','contacts','suppliers','products','lots','sales','deals','payments','expenses'];
function syncSnapshot(source){const s=B.clone(source);delete s.revision;delete s.updatedAt;if(s.settings){delete s.settings.cloudApi;delete s.settings.cloudOrganization;}return s}
function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function emptyBusinessData(s){return SYNC_TABLES.every(name=>!(s[name]||[]).length)&&!(s.audit||[]).length}
function mergeSnapshots(base,local,remote,resolveMode=''){const out=B.clone(remote),conflicts=[];for(const k of new Set([...Object.keys(base.settings||{}),...Object.keys(local.settings||{}),...Object.keys(remote.settings||{})])){const b=base.settings?.[k],l=local.settings?.[k],r=remote.settings?.[k];if(k==='cloudApi'||k==='cloudOrganization')continue;const lc=!same(l,b),rc=!same(r,b);if(lc&&rc&&!same(l,r)){if(!resolveMode)conflicts.push('Préférence « '+k+' »');out.settings[k]=resolveMode==='local'?l:r;}else if(lc)out.settings[k]=l;}for(const table of SYNC_TABLES){const bm=new Map((base[table]||[]).map(x=>[x.id,x])),lm=new Map((local[table]||[]).map(x=>[x.id,x])),rm=new Map((remote[table]||[]).map(x=>[x.id,x])),ids=new Set([...bm.keys(),...lm.keys(),...rm.keys()]),merged=[];for(const id of ids){const b=bm.get(id),l=lm.get(id),r=rm.get(id),lc=!same(l,b),rc=!same(r,b);if(lc&&rc&&!same(l,r)){if(!resolveMode)conflicts.push(table+' · '+id);const value=resolveMode==='local'?l:r;if(value!==undefined)merged.push(value);continue}const value=lc?l:r;if(value!==undefined)merged.push(value)}out[table]=merged}const audit=new Map([...(remote.audit||[]),...(local.audit||[])].map(x=>[x.id,x]));out.audit=Array.from(audit.values()).sort((a,b)=>(a.at||'').localeCompare(b.at||'')).slice(-5000);if(conflicts.length)return {conflicts};try{return {snapshot:B.validate(out),conflicts:[]}}catch(e){return {conflicts:['Données incompatibles : '+e.message]}}}
function syncStatus(message){syncMessage=message;const el=$('#cloudSyncStatus');if(el)el.textContent=message}
function queueCloudSync(delay=1300){if(applyingCloud||!cloudTokenValid()||!navigator.onLine)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>cloudSync(),delay)}
async function applyCloudSnapshot(snapshot,label){const next=B.clone(B.validate(snapshot));applyingCloud=true;try{await persist(next,label)}finally{applyingCloud=false}}
async function cloudSync(){if(syncBusy||applyingCloud||!navigator.onLine)return;if(!licenseToken){syncStatus(t('Activez une licence éligible pour synchroniser.','Alefaso ny fahazoan-dalana ahafahana mampifanaraka.'));return}syncBusy=true;try{if(!cloudTokenValid())await renewalToken();const path='/v1/cloud/snapshot?resource=biznako-main';let local=syncSnapshot(state),base=await readStore('license-cloud-base');for(let attempt=0;attempt<3;attempt++){const remoteData=await cloudRequest(path),remote=remoteData.snapshot?syncSnapshot(remoteData.snapshot):null;local=syncSnapshot(state);if(remote&&!base){if(emptyBusinessData(local)){await applyCloudSnapshot(remote,t('Données Biznako récupérées depuis Cloud','Naverina avy amin’ny Cloud ny angona Biznako'));local=syncSnapshot(state);base=remote;}else if(!same(local,remote)){const takeCloud=confirm(t('Une copie Cloud existe pour cette licence. OK : récupérer la copie Cloud sur cet appareil. Annuler : garder les données locales.','Misy tahiry Cloud ho an’ity fahazoan-dalana ity. OK: avereno eto ny Cloud. Cancel: tehirizo ny eto an-toerana.'));if(takeCloud){await applyCloudSnapshot(remote,t('Données Cloud récupérées','Naverina ny angona Cloud'));local=syncSnapshot(state);base=remote;}else{if(!confirm(t('Remplacer la copie Cloud de cette licence par les données locales ?','Hosoloina amin’ny angona eto an-toerana ve ny Cloud?')))return;const posted=await cloudRequest(path,{method:'PUT',body:JSON.stringify({expectedRevision:remoteData.revision,snapshot:local})});base=local;await writeAux(base,'license-cloud-base');licenseVault.lastSyncAt=new Date().toISOString();await saveVault();syncStatus(t('Copie locale synchronisée · révision ','Nampifanarahana ny eto an-toerana · dika ')+posted.revision);return}}else base=remote}else if(remote&&base){let merged=mergeSnapshots(syncSnapshot(base),local,remote);if(merged.conflicts.length){const preferLocal=confirm(t('Conflit sur ','Fifanoherana amin’ny ')+merged.conflicts.length+t(' élément(s). OK : garder les versions locales en conflit. Annuler : garder les versions Cloud. Les autres changements sont fusionnés.',' singa. OK: tehirizo ny eo an-toerana. Cancel: tehirizo ny Cloud. Atambatra ireo fanovana hafa.'));merged=mergeSnapshots(syncSnapshot(base),local,remote,preferLocal?'local':'cloud')}if(merged.conflicts.length){syncStatus(t('Fusion interrompue ; aucune donnée locale n’a été effacée.','Najanona ny fampifangaroana; tsy nisy angona voafafa.'));return}local=syncSnapshot(merged.snapshot)}else if(!remote){local=syncSnapshot(state)}const changed=!remote||!same(local,remote);let revision=remoteData.revision;if(changed){try{const posted=await cloudRequest(path,{method:'PUT',body:JSON.stringify({expectedRevision:remoteData.revision,snapshot:local})});revision=posted.revision}catch(err){if(err.status===409)continue;throw err}}if(!same(syncSnapshot(state),local))await applyCloudSnapshot(local,t('Synchronisation Cloud reçue','Voaray ny fampifanarahana Cloud'));base=syncSnapshot(state);await writeAux(base,'license-cloud-base');licenseVault.lastSyncAt=new Date().toISOString();await saveVault();syncStatus(t('Synchronisé · révision Cloud ','Voarindra · dika Cloud ')+revision+' · '+new Date().toLocaleTimeString());return}throw Error(t('Conflit de synchronisation répété. La reprise sera automatique.','Niverimberina ny fifanoherana. Haverina ho azy ny fampifanarahana.'))}catch(err){const message=apiStatusError(err);syncStatus(message);if(err.status===401||err.status===403){licenseError=message;render()}else if(err.status===409)queueCloudSync(2000)}finally{syncBusy=false}}
async function cloudPull(){await cloudSync()}
async function cloudPush(){await cloudSync()}
document.addEventListener('submit',async e=>{if(e.target?.id!=='licenseActivationForm')return;e.preventDefault();const code=$('#licenseCode')?.value||'';try{await activateLicense(code);close(true);toast(t('Licence activée et Cloud vérifié.','Nandeha ny fahazoan-dalana ary voamarina ny Cloud.'))}catch(err){licenseError=err.message;licenseStatus=err.status===403?'revoked':'error';openCloudModal(err.message)}});
window.addEventListener('online',()=>restoreCloudSession());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')restoreCloudSession()});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,table=b.dataset.table,id=b.dataset.id;try{
if(a==='nav'){go(b.dataset.view);if(b.dataset.filterStatus){query.status=b.dataset.filterStatus;render();}return;}if(a==='menu'){$('#sidebar').classList.toggle('open');return;}if(a==='close'){close();return;}if(a==='add'){edit(table);return;}if(a==='edit'){edit(table,id);return;}if(a==='duplicate'){edit(table,id,true);return;}if(a==='actions'){actions(table,id);return;}if(a==='document'){documentView(table,id);return;}if(a==='pay'){edit('payments');const f=$('#edit-form');if(f){const r=B.get(state,table,id),type=table==='sales'?'sale':'deal';f.elements.document.value=type+':'+id;f.elements.amount.value=Math.max(0,(type==='sale'?B.total(r):B.commission(r))-B.paid(state,type,id));}return;}
if(a==='delete'){if(confirm(t('Supprimer cet élément ? Les éléments référencés par d’autres documents ne peuvent pas être supprimés.','Hamafa ity singa ity? Tsy azo fafana raha mbola ampiasain’ny taratasy hafa.')))await mutate(table,B.get(state,table,id),'delete');return;}
if(a==='addLine'){$('#lines').insertAdjacentHTML('beforeend',lineEditor({lot:state.lots[0].id,qty:1,price:B.get(state,'products',state.lots[0].product).price}));$('#edit-form').dataset.dirty='true';updateTotals();return;}if(a==='removeLine'){b.closest('.line-editor').remove();$('#edit-form').dataset.dirty='true';updateTotals();return;}
if(a==='theme'){const n=B.clone(state);n.settings.theme=state.settings.theme==='light'?'dark':'light';await persist(n);return;}
if(a==='undo'){if(undo&&confirm(t('Annuler la dernière modification ?','Averina ny fanovana farany?'))){await persist(B.clone(undo),t('Annulation de la dernière modification','Famerenana ny fanovana farany'));undo=null;render();}return;}
if(a==='clearFilters'){query={q:'',field:'all',activity:'',status:'',from:'',to:'',sort:'date-desc'};page=0;render();return;}
if(a==='saveFilter'){const label=prompt(t('Nom de ce filtre','Anaran’ity sivana ity'));if(label){const n=B.clone(state);n.filters.push({id:B.uid(),name:label.slice(0,60),view,query:B.clone(query)});await persist(n);}return;}
if(a==='loadFilter'){const f=state.filters.find(x=>x.id===id);query={...query,...f.query};page=0;render();return;}if(a==='deleteFilter'){if(confirm(t('Supprimer ce filtre ?','Hamafa ity sivana ity?'))){const n=B.clone(state);n.filters=n.filters.filter(x=>x.id!==id);await persist(n);}return;}
if(a==='prev'){page=Math.max(0,page-1);render();return;}if(a==='next'){page++;render();return;}
if(a==='backup'){await backup();return;}if(a==='csv'){await listCSV();return;}
if(a==='auditCSV'){await download('Biznako_journal.csv',B.csv([['Date','Action','ID'],...state.audit.map(x=>[x.at,x.action,x.record||''])]),'text/csv;charset=utf-8');return;}
if(a==='cashCSV'){const m=B.metrics(state,query);await download('Biznako_flux.csv',B.csv([['Date','Type','Référence','Montant Ar'],...m.payments.map(r=>[r.date,'Encaissement',r.ref,r.amount]),...m.expenses.map(r=>[r.date,'Dépense',r.name,-r.amount])]),'text/csv;charset=utf-8');return;}
if(a==='printDoc'){await print(docHtml);return;}if(a==='printList'){const html=`<h1>${esc(state.settings.name)} · ${t(...menus.find(m=>m[0]===view).slice(2))}</h1><p>${fmt(B.today())} · ${esc(query.q)} · ${fmt(query.from)} → ${fmt(query.to)}</p><table><thead><tr>${listColumns(view).map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${filtered(view).map(r=>`<tr>${rowCells(view,r).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;docHtml=html;modal(t('Aperçu avant impression','Topimaso alohan’ny fanontana'),html,btn(t('Imprimer / PDF','Hanonta / PDF'),'printDoc','','primary'));return;}
if(a==='printReport'){await print($('.content').innerHTML);return;}
if(a==='guide'){guide();return;}if(a==='start'){const n=B.clone(state);n.settings.onboard=true;await persist(n);close();return;}
if(a==='demo'){const choice=prompt(t('Choisissez le profil de démonstration : 1 = commerce de biens, 2 = services, 3 = mixte','Safidio ny ohatra: 1 = entana, 2 = tolotra, 3 = mifangaro'),'3');const mode=choice==='1'?'goods':choice==='2'?'service':choice==='3'?'mixed':null;if(!mode)return;if(confirm(t('Charger les exemples en remplaçant les données actuelles ? Exportez une sauvegarde avant de confirmer.','Hampiditra ohatra ka hanolo ny angona ankehitriny? Manaova tahiry alohan’ny hanekena.'))){const n=B.demo(mode);n.settings.lang=state.settings.lang;n.settings.theme=state.settings.theme;await persist(n,'Démonstration chargée');close();go('dashboard');}return;}
if(a==='reset'||a==='resetDemo'){if(confirm(t('Effacer toute la base et repartir vide ? Cette action concerne aussi vos ajouts éventuels.','Hamafa ny tahiry rehetra ka hanomboka foana? Ho voafafa koa izay nampidirinao.'))&&prompt(t('Tapez EFFACER pour confirmer.','Soraty EFFACER hanamafisana.'))==='EFFACER'){const n=B.empty();n.settings={...state.settings,demo:false,onboard:true};await persist(n,'Base réinitialisée');close();go('dashboard');}return;}
if(a==='recover'){const previous=await readStore('previous');if(!previous)throw Error(t('Aucune version précédente disponible.','Tsy misy tahiry teo aloha.'));if(confirm(t('Restaurer la version précédente ?','Hamerina ny tahiry teo aloha?'))){await persist(B.validate(previous),'Version précédente restaurée');toast(t('Version récupérée.','Tafaverina ny tahiry.'));}return;}
if(a==='statusAdd'){modal(t('Nouveau statut','Sata vaovao'),`<form id="status-form" class="stack">${field(t('Libellé','Anarana'),'label','','text','required maxlength="60"')}${select(t('Effet métier','Fiantraikany'),'effect',[{id:'draft',name:t('Brouillon : aucun effet','Drafitra: tsy misy fiantraikany')},{id:'valid',name:t('Validé : stock et calculs actifs','Voamarina: mandeha ny tahiry sy kajy')},{id:'cancel',name:t('Annulé : exclu des calculs','Nofoanana: tsy tafiditra amin’ny kajy')}],'draft')}<button class="primary">${t('Enregistrer','Hitahiry')}</button></form>`);$('#status-form').onsubmit=async e=>{e.preventDefault();try{const n=B.clone(state);n.statuses.push({id:B.uid(),label:e.target.elements.label.value.trim(),effect:e.target.elements.effect.value});await persist(n,'Statut ajouté');close();}catch(err){error(err);}};return;}
if(a==='statusDelete'){if(confirm(t('Supprimer ce statut ?','Hamafa ity sata ity?'))){const n=B.clone(state);n.statuses=n.statuses.filter(s=>s.id!==id);await persist(n,'Statut supprimé');}return;}
if(a==='cloudInfo'){openCloudModal();return;}if(a==='licenseTrial'){try{await startLicenseTrial();close(true);toast(t('Essai activé.','Nalefa ny fitsapana.'))}catch(err){licenseError=err.message;licenseStatus=err.status===403?'revoked':'error';openCloudModal(err.message)}return;}if(a==='cloudSyncNow'){await cloudSync();return;}if(a==='cloudPush'){await cloudPush();return;}if(a==='cloudPull'){await cloudPull();return;}
if(a==='reminder'){const d=new Date();d.setDate(d.getDate()+1);d.setHours(18,0,0,0);await bridge().scheduleReminder({at:d.getTime(),title:'Biznako',body:t('Pensez à enregistrer vos ventes et encaissements.','Aza adino ny mandrakitra ny varotra sy vola voaray.')});toast(t('Rappel demandé pour demain vers 18 h.','Fampahatsiahivana rahampitso amin’ny 18 ora eo ho eo.'));return;}
if(a==='cancelReminder'){await bridge().cancelReminder();toast(t('Rappel annulé.','Nofoanana ny fampahatsiahivana.'));return;}
}catch(err){error(err);}});
document.addEventListener('keydown',e=>{if($('#modal').hidden)return;if(e.key==='Escape'){e.preventDefault();close();}if(e.key==='Tab'){const focus=$$('#modal button:not([disabled]), #modal input, #modal select, #modal textarea').filter(el=>!el.hidden);const first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
window.bizBack=()=>{if(!$('#modal').hidden){close();return;}if(view!=='dashboard'){go('dashboard');return;}if(confirm(t('Quitter Biznako ? Vos données enregistrées sont conservées.','Hivoaka an’i Biznako? Voatahiry ny angona.')))bridge().exitApp();};
window.addEventListener('unhandledrejection',e=>{e.preventDefault();error(e.reason);});
async function init(){try{await openDB();const saved=await readStore('current');state=saved?B.validate(saved):B.empty();if(!saved)await writeStore(state,0);if(state.settings.cloudApi||state.settings.cloudOrganization){const cleaned=B.clone(state);delete cleaned.settings.cloudApi;delete cleaned.settings.cloudOrganization;await writeStore(cleaned,state.revision);state=cleaned;}await writeAux(null,'cloud-session');await writeAux(null,'cloud-base');render();restoreCloudSession();if(!state.settings.onboard)guide();}catch(err){console.error('[Biznako startup]',err.message);$('#app').innerHTML=`<section class="error-screen card"><h1>Biznako</h1><p class="error">${esc(err.message)}</p><p>Impossible d’ouvrir les données. Aucune donnée existante n’a été écrasée. Utilisez un navigateur normal, autorisez le stockage puis réessayez.</p><button onclick="location.reload()">Réessayer / Andramo indray</button><button id="emergency">Exporter les données brutes</button></section>`;$('#emergency').onclick=async()=>{try{const raw=db&&await readStore('current');if(raw)await download('Biznako_recuperation.json',JSON.stringify(raw,null,2));else alert('Aucune donnée accessible.');}catch(e){alert(e.message);}};}}
init();
})();
</script></body></html>
