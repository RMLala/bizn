name: Audit de finalisation
on:
  workflow_run:
    workflows: ["Biznako Android API 23 et 29"]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "ID de compilation a auditer (test manuel)"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Controler le run source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$REPO/actions/runs/$RUN_ID" > run.json
          jq -e --arg repo "$REPO" '.repository.full_name == $repo and .status == "completed" and .conclusion == "success" and .name == "Biznako Android API 23 et 29"' run.json >/dev/null
          echo "## Audit technique Biznako v1.2.0" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compilation : $RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit source : $(jq -r .head_sha run.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation fonctionnelle : EN ATTENTE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Licence, synchro, sauvegarde et guide : A VERIFIER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Visibilite du depot : INCHANGEE" >> "$GITHUB_STEP_SUMMARY"
      - name: Recuperer les archives APK
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id || inputs.build_run_id }}
          github-token: ${{ github.token }}
          pattern: Biznako-1.2.0-*
          path: audit-apks
      - name: Verifier les quatre APK et les archives
        shell: bash
        run: |
          set -euo pipefail
          base="audit-apks"
          debug="$base/Biznako-1.2.0-Debug-API23-API29"
          release="$base/Biznako-1.2.0-Release-API23-API29"
          for spec in \
            "$debug|app-api23-debug.apk" \
            "$debug|app-api29-debug.apk" \
            "$release|app-api23-release.apk" \
            "$release|app-api29-release.apk"; do
            folder="${spec%%|*}"
            name="${spec#*|}"
            count="$(find "$folder" -type f -name "$name" | wc -l)"
            if [[ "$count" -ne 1 ]]; then
              echo "❌ APK absent ou ambigu : $name" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            file="$(find "$folder" -type f -name "$name" -print -quit)"
            test -s "$file"
            unzip -tq "$file" >/dev/null
            echo "- ✅ APK present et archive lisible : $name" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- Signatures Release : NON VERIFIEES dans cette version de l'audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Statut : controle des artefacts reussi, pas de finalisation automatique" >> "$GITHUB_STEP_SUMMARY"
