name: Biznako Android
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ['**', '!README.md']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install dependencies and sync Capacitor
        run: npm ci && npm run sync
      - name: Build debug APKs
        working-directory: android
        run: ./gradlew assembleApi23Debug assembleApi29Debug
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: Biznako-1.2.0-Debug-API23-API29
          path: android/app/build/outputs/apk/*/debug/*.apk
      - name: Prepare release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks
      - name: Build signed release APKs
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != ''
        working-directory: android
        run: ./gradlew assembleApi23Release assembleApi29Release -Pandroid.injected.signing.store.file=release-key.jks -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
      - name: Upload signed release APKs
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: Biznako-1.2.0-Release-API23-API29
          path: android/app/build/outputs/apk/*/release/*.apk
